{#- Reusable inline SVG icon set (stroke based, inherits currentColor) -#}
{% macro icon(name, size=20, cls="") -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
  {%- if name == 'cart' -%}

    <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
  {%- elif name == 'gauge' -%}
    <path d="M12 14l4-4"/><path d="M3.5 18a9 9 0 1 1 17 0"/><path d="M3 18h18"/>

    <circle cx="12" cy="12" r="4.2"/>

    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  {%- elif name == 'lock' -%}
    <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>

  {%- elif name == 'alert' -%}

    <circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>
  {%- elif name == 'home' -%}
    <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>

    <path d="M3 21h18"/><rect x="5" y="11" width="3.5" height="7" rx="1"/><rect x="10.2" y="6" width="3.5" height="12" rx="1"/><rect x="15.5" y="9" width="3.5" height="9" rx="1"/>

  {%- elif name == 'shop' -%}
    <path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/><path d="M2 9h20"/>
  {%- elif name == 'list' -%}
    <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
  {%- elif name == 'sun-cloud' -%}
    <circle cx="7" cy="7" r="3"/><path d="M7 2v1M2 7h1M3.5 3.5l.7.7M10.5 3.5l-.7.7"/>
    <path d="M6 19h9a3.5 3.5 0 0 0 .6-6.95A5 5 0 0 0 6 13.5"/><path d="M4 19h.01"/>
  {%- elif name == 'cloud' -%}
    <path d="M17.5 19a4.5 4.5 0 0 0 .9-8.9A7 7 0 0 0 4.7 12.6 3.5 3.5 0 0 0 6 19h11.5z"/>
  {%- elif name == 'rain' -%}
    <path d="M17.5 15a4.5 4.5 0 0 0 .9-8.9A7 7 0 0 0 4.7 8.6 3.5 3.5 0 0 0 6 15h11.5z"/>

  {%- elif name == 'droplet' -%}
    <path d="M12 2.7S6 9.2 6 13.5a6 6 0 0 0 12 0C18 9.2 12 2.7 12 2.7z"/>
  {%- elif name == 'tag' -%}
    <path d="M20.6 13.4L11 3.8a2 2 0 0 0-1.4-.6H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .6 1.4l9.6 9.6a2 2 0 0 0 2.8 0l4.6-4.6a2 2 0 0 0 0-2.8z"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none"/>

    <rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13"/>
    <path d="M12 8S9.5 8 8 6.5 8.4 3 10 3.6 12 8 12 8zM12 8s2.5 0 4-1.5S15.6 3 14 3.6 12 8 12 8z"/>

    <path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/>
  {%- elif name == 'heart' -%}
    <path d="M12 20.5S3.5 15 3.5 9.3A4.8 4.8 0 0 1 12 6.2a4.8 4.8 0 0 1 8.5 3.1C20.5 15 12 20.5 12 20.5z"/>
  {%- endif -%}
